name: Reusable .NET Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        description: Target GitHub environment to deploy to
        required: true
        type: string

jobs:
  build-test-publish-deploy:
    name: Build, Test, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    # OIDC requires id-token: write so azure/login can exchange the GitHub token.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            TailspinToys.sln
            src/TailspinToys.Web/TailspinToys.Web.csproj
            tests/TailspinToys.Web.Tests/TailspinToys.Web.Tests.csproj

      # Restore and build once, then reuse outputs in test/publish for faster execution.
      - name: Restore dependencies
        run: dotnet restore TailspinToys.sln

      - name: Build
        run: dotnet build TailspinToys.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TailspinToys.sln --configuration Release --no-build --verbosity normal

      - name: Publish web app
        run: dotnet publish src/TailspinToys.Web/TailspinToys.Web.csproj --configuration Release --no-build --output ./publish

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # AZURE_WEBAPP_NAME is read from the selected GitHub environment variables.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
