# =============================================================================
# TailspinToys CI/CD Pipeline
# =============================================================================
# This workflow provides a complete CI/CD pipeline for the TailspinToys web application.
# 
# Pipeline Flow:
# 1. 🔍 Code Quality & Security Checks (all branches/PRs)
# 2. 🏗️  Build & Test (all branches/PRs)  
# 3. 🚀 Deploy to Development (develop branch)
# 4. 🚀 Deploy to Production (main branch)
#
# Branch Strategy:
# - develop: Continuous deployment to development environment
# - main: Continuous deployment to production environment
# - feature/*: Build and test only (no deployment)
# - PRs: Build, test, and quality checks only
# =============================================================================

name: TailspinToys CI/CD

on:
  # Trigger on pushes to main branches
  push:
    branches: 
      - main
      - develop
    # Ignore changes to documentation and CI files for optimization
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  
  # Trigger on pull requests to main branches
  pull_request:
    branches: 
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  
  # Allow manual triggering with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - production
      deploy_only:
        description: 'Skip build and deploy existing artifacts'
        required: false
        default: false
        type: boolean

# =============================================================================
# Security: Grant minimal permissions needed for OIDC and deployments
# =============================================================================
permissions:
  id-token: write      # Required for OIDC authentication to Azure
  contents: read       # Required to checkout code
  actions: read        # Required to download artifacts
  security-events: write  # Required for CodeQL security scanning

# =============================================================================
# Environment Variables: Global configuration
# =============================================================================
env:
  # .NET Configuration
  DOTNET_VERSION: '9.0.x'
  DOTNET_CONFIGURATION: 'Release'
  
  # Build Configuration
  SOLUTION_PATH: './TailspinToys.sln'
  WEB_PROJECT_PATH: './src/TailspinToys.Web/TailspinToys.Web.csproj'
  
  # Deployment Configuration
  ARTIFACT_RETENTION_DAYS: 30
  HEALTH_CHECK_PATH: '/health'

jobs:
  # =============================================================================
  # Job 1: Code Quality and Security Analysis
  # =============================================================================
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    # Initialize CodeQL for security analysis
    - name: 🛡️ Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        build-mode: autobuild
    
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    # Perform CodeQL Analysis
    - name: 🔍 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  # =============================================================================
  # Job 2: Build, Test, and Package Application
  # =============================================================================
  build:
    name: 🏗️ Build & Test
    uses: ./.github/workflows/dotnet-build.yml
    with:
      configuration: 'Release'
      dotnet-version: '9.0.x'
      publish-artifacts: ${{ github.event_name == 'push' || github.event.inputs.deploy_only == 'false' }}
      enable-coverage: true
    
    # This job runs on all events unless it's a deploy-only workflow dispatch
    if: github.event.inputs.deploy_only != 'true'

  # =============================================================================
  # Job 3: Deploy to Development Environment
  # =============================================================================
  deploy-development:
    name: 🚀 Deploy to Development
    needs: [build]
    if: |
      always() && 
      (needs.build.result == 'success' || github.event.inputs.deploy_only == 'true') &&
      (
        (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
        (github.event.inputs.environment == 'development' && github.event_name == 'workflow_dispatch')
      )
    
    uses: ./.github/workflows/azure-deploy.yml
    with:
      environment: development
      app-name: ${{ vars.AZURE_WEBAPP_NAME_DEV }}
      artifact-name: webapp-${{ needs.build.outputs.build-version }}
      health-check-path: '/health'
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # =============================================================================
  # Job 4: Deploy to Production Environment
  # =============================================================================
  deploy-production:
    name: 🚀 Deploy to Production
    needs: [build]
    if: |
      always() && 
      (needs.build.result == 'success' || github.event.inputs.deploy_only == 'true') &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch')
      )
    
    uses: ./.github/workflows/azure-deploy.yml
    with:
      environment: production
      app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
      artifact-name: webapp-${{ needs.build.outputs.build-version }}
      health-check-path: '/health'
    secrets:
      azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # =============================================================================
  # Job 5: Deployment Notification and Cleanup
  # =============================================================================
  post-deployment:
    name: 📋 Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-development, deploy-production]
    if: always() && (needs.deploy-development.result != 'skipped' || needs.deploy-production.result != 'skipped')
    
    steps:
    - name: 📊 Generate deployment report
      run: |
        echo "## 🚀 TailspinToys Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Environment Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Development status
        if [ "${{ needs.deploy-development.result }}" = "success" ]; then
          echo "✅ **Development:** Deployed successfully" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-development.result }}" = "failure" ]; then
          echo "❌ **Development:** Deployment failed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⏭️ **Development:** Skipped" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Production status
        if [ "${{ needs.deploy-production.result }}" = "success" ]; then
          echo "✅ **Production:** Deployed successfully" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-production.result }}" = "failure" ]; then
          echo "❌ **Production:** Deployment failed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⏭️ **Production:** Skipped" >> $GITHUB_STEP_SUMMARY
        fi
    
    # Clean up old artifacts to save storage space
    - name: 🧹 Cleanup old artifacts
      continue-on-error: true
      run: |
        echo "Cleaning up artifacts older than ${{ env.ARTIFACT_RETENTION_DAYS }} days..."
        # Note: This would typically use GitHub API to clean up old artifacts
        # For now, we rely on the retention-days setting in upload steps
