name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    env:
      BUILD_CONFIGURATION: Release
      WEB_PROJECT_PATH: src/TailspinToys.Web/TailspinToys.Web.csproj
      PUBLISH_PATH: ${{ github.workspace }}/publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            **/global.json

      - name: Restore dependencies
        run: dotnet restore TailspinToys.sln

      - name: Build
        run: dotnet build TailspinToys.sln --configuration $BUILD_CONFIGURATION --no-restore

      - name: Test
        run: dotnet test TailspinToys.sln --configuration $BUILD_CONFIGURATION --no-build --verbosity normal

      - name: Publish web app
        if: github.event_name == 'push'
        run: dotnet publish $WEB_PROJECT_PATH --configuration $BUILD_CONFIGURATION --output $PUBLISH_PATH --no-build

      - name: Upload publish artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.PUBLISH_PATH }}

  deploy:
    if: github.event_name == 'push'
    needs: build-test-publish
    runs-on: ubuntu-latest

    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish
