name: CI/CD

on:
  push:
  pull_request:

# Default to least privilege for all jobs; elevate only where required.
permissions:
  contents: read

# Cancel stale runs on feature branches while preserving main branch history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Pull request validation: compile and test without deployment.
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            TailspinToys.sln
            src/TailspinToys.Web/TailspinToys.Web.csproj
            tests/TailspinToys.Web.Tests/TailspinToys.Web.Tests.csproj

      - name: Restore dependencies
        run: dotnet restore TailspinToys.sln

      - name: Build
        run: dotnet build TailspinToys.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TailspinToys.sln --configuration Release --no-build --verbosity normal

  # Continuous deployment to the dev environment on every push.
  deploy-dev:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: ./.github/workflows/reusable-dotnet-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment_name: dev
    secrets: inherit

  # Promotion to prod only from main after dev deployment succeeds.
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-dev
    uses: ./.github/workflows/reusable-dotnet-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment_name: prod
    secrets: inherit

  # Continuous deployment to the AWS dev environment on every push.
  deploy-dev-aws:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    uses: ./.github/workflows/reusable-dotnet-deploy-aws.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment_name: dev
    secrets: inherit

  # Promotion to AWS prod only from main after AWS dev deployment succeeds.
  deploy-prod-aws:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-dev-aws
    uses: ./.github/workflows/reusable-dotnet-deploy-aws.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment_name: prod
    secrets: inherit
