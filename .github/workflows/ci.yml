name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Grant GITHUB_TOKEN permissions needed for OIDC authentication with Azure
permissions:
  id-token: write
  contents: read

# Prevent concurrent deployments to the same environment to avoid race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Set a timeout to prevent the job from hanging indefinitely
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    # Upload build artifacts for the deployment jobs; only needed on branch pushes
    - name: Upload build artifacts
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      uses: actions/upload-artifact@v4
      with:
        name: webapp-build
        path: src/TailspinToys.Web/

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    # Set a timeout to prevent the deployment from hanging indefinitely
    timeout-minutes: 15

    steps:
    # Validate that all required secrets and variables are configured before proceeding
    - name: Validate required configuration
      run: |
        missing=()
        [[ -z "${{ secrets.AZURE_CLIENT_ID }}" ]]      && missing+=("AZURE_CLIENT_ID")
        [[ -z "${{ secrets.AZURE_TENANT_ID }}" ]]      && missing+=("AZURE_TENANT_ID")
        [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
        [[ -z "${{ vars.AZURE_WEBAPP_NAME_DEV }}" ]]   && missing+=("AZURE_WEBAPP_NAME_DEV")
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "::error::Missing required configuration: ${missing[*]}"
          exit 1
        fi

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: webapp-build
        path: ./webapp

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish application
      run: |
        cd webapp
        dotnet publish --configuration Release --output ./publish

    - name: Azure Login using OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App (Development)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME_DEV }}
        package: ./webapp/publish

    # Verify the application is responding after deployment
    - name: Post-deployment health check (Development)
      run: |
        url="https://${{ vars.AZURE_WEBAPP_NAME_DEV }}.azurewebsites.net"
        echo "Running health check against $url"
        for i in 1 2 3; do
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 "$url")
          if [[ "$status" -ge 200 && "$status" -lt 400 ]]; then
            echo "Health check passed (HTTP $status)"
            exit 0
          fi
          echo "Attempt $i: received HTTP $status, retrying in 15s..."
          sleep 15
        done
        echo "::error::Health check failed after 3 attempts for $url"
        exit 1

    # Always log out of Azure to clean up credentials, even if a prior step failed
    - name: Azure Logout
      if: always()
      run: az logout

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # Set a timeout to prevent the deployment from hanging indefinitely
    timeout-minutes: 15

    steps:
    # Validate that all required secrets and variables are configured before proceeding
    - name: Validate required configuration
      run: |
        missing=()
        [[ -z "${{ secrets.AZURE_CLIENT_ID }}" ]]      && missing+=("AZURE_CLIENT_ID")
        [[ -z "${{ secrets.AZURE_TENANT_ID }}" ]]      && missing+=("AZURE_TENANT_ID")
        [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]] && missing+=("AZURE_SUBSCRIPTION_ID")
        [[ -z "${{ vars.AZURE_WEBAPP_NAME_PROD }}" ]]  && missing+=("AZURE_WEBAPP_NAME_PROD")
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "::error::Missing required configuration: ${missing[*]}"
          exit 1
        fi

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: webapp-build
        path: ./webapp

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish application
      run: |
        cd webapp
        dotnet publish --configuration Release --output ./publish

    - name: Azure Login using OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App (Production)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
        package: ./webapp/publish

    # Verify the application is responding after deployment
    - name: Post-deployment health check (Production)
      run: |
        url="https://${{ vars.AZURE_WEBAPP_NAME_PROD }}.azurewebsites.net"
        echo "Running health check against $url"
        for i in 1 2 3; do
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 "$url")
          if [[ "$status" -ge 200 && "$status" -lt 400 ]]; then
            echo "Health check passed (HTTP $status)"
            exit 0
          fi
          echo "Attempt $i: received HTTP $status, retrying in 15s..."
          sleep 15
        done
        echo "::error::Health check failed after 3 attempts for $url"
        exit 1

    # Always log out of Azure to clean up credentials, even if a prior step failed
    - name: Azure Logout
      if: always()
      run: az logout
