name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK with NuGet cache
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            TailspinToys.sln
            src/TailspinToys.Web/TailspinToys.Web.csproj
            tests/TailspinToys.Web.Tests/TailspinToys.Web.Tests.csproj

      - name: Restore dependencies
        run: dotnet restore TailspinToys.sln

      - name: Build
        run: dotnet build TailspinToys.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TailspinToys.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/TailspinToys.Web/TailspinToys.Web.csproj --configuration Release --no-build --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    environment: azure

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
