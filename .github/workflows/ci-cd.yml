name: CI/CD - Build & Deploy to Azure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_WEBAPP_NAME: 'tailspintoys'  # Change to your Azure App Service name
  AZURE_WEBAPP_PACKAGE_PATH: './publish'
  AZURE_RESOURCE_GROUP: 'your-resource-group'  # Change to your Azure resource group

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./src/TailspinToys.Web

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: ./src/TailspinToys.Web

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: ./tests/TailspinToys.Web.Tests

    - name: Publish
      run: dotnet publish ./src/TailspinToys.Web/TailspinToys.Web.csproj -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Staging
    environment: staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App (Staging)
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}-staging
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-production:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: webapp-artifact
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App (Production)
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
